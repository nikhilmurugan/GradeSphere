<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Students</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            padding: 30px 0;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .btn-danger {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
        }

        .content-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .form-section {
            margin-bottom: 30px;
        }

        .form-section h2 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .form-group input:focus {
            border-color: #667eea;
            outline: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        .grade-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            color: white;
        }

        .grade-a-plus { background: #28a745; }
        .grade-a { background: #20c997; }
        .grade-b-plus { background: #17a2b8; }
        .grade-b { background: #007bff; }
        .grade-c { background: #ffc107; color: #333; }
        .grade-d { background: #fd7e14; }
        .grade-f { background: #dc3545; }

        .status-pass { color: #28a745; font-weight: bold; }
        .status-fail { color: #dc3545; font-weight: bold; }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        #message {
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            display: none;
        }

        #message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        #message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Student Management System</h1>
            <a href="/" class="btn" style="margin-top: 20px;">← Back to Home</a>
        </header>

        <div class="content-card">
            <div class="controls">
                <button class="btn btn-success" onclick="loadStudents()">🔄 Refresh</button>
                <button class="btn" onclick="toggleForm()">➕ Add Student</button>
                <button class="btn btn-success" onclick="bulkCalculate()">⚡ Bulk Calculate</button>
                <input type="file" id="csvFile" accept=".csv" style="display:none" onchange="importCSV()">
                <button class="btn" onclick="document.getElementById('csvFile').click()">📤 Import CSV</button>
                <button class="btn btn-danger" onclick="exportCSV()">📥 Export CSV</button>
            </div>

            <div id="message"></div>

            <div id="addFormSection" class="form-section" style="display:none;">
                <h2>Add New Student</h2>
                <form id="studentForm" onsubmit="addStudent(event)">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Name:</label>
                            <input type="text" id="name" required>
                        </div>
                        <div class="form-group">
                            <label>Roll Number:</label>
                            <input type="text" id="rollNumber" required>
                        </div>
                        <div class="form-group">
                            <label>Email:</label>
                            <input type="email" id="email" required>
                        </div>
                        <div class="form-group">
                            <label>Maths (0-100):</label>
                            <input type="number" id="mathsMarks" min="0" max="100" required>
                        </div>
                        <div class="form-group">
                            <label>Physics (0-100):</label>
                            <input type="number" id="physicsMarks" min="0" max="100" required>
                        </div>
                        <div class="form-group">
                            <label>Chemistry (0-100):</label>
                            <input type="number" id="chemistryMarks" min="0" max="100" required>
                        </div>
                        <div class="form-group">
                            <label>English (0-100):</label>
                            <input type="number" id="englishMarks" min="0" max="100" required>
                        </div>
                        <div class="form-group">
                            <label>Computer (0-100):</label>
                            <input type="number" id="computerMarks" min="0" max="100" required>
                        </div>
                    </div>
                    <div style="margin-top: 20px; display: flex; gap: 10px;">
                        <button type="submit" class="btn btn-success">Save Student</button>
                        <button type="button" class="btn btn-danger" onclick="toggleForm()">Cancel</button>
                    </div>
                </form>
            </div>

            <div id="studentsTable"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api';

        // Load students on page load
        window.onload = function() {
            loadStudents();
        };

        function toggleForm() {
            const form = document.getElementById('addFormSection');
            form.style.display = form.style.display === 'none' ? 'block' : 'none';
        }

        function showMessage(message, type) {
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = message;
            msgDiv.className = type;
            msgDiv.style.display = 'block';
            setTimeout(() => {
                msgDiv.style.display = 'none';
            }, 5000);
        }

        async function loadStudents() {
            const tableDiv = document.getElementById('studentsTable');
            tableDiv.innerHTML = '<div class="loading">Loading students...</div>';

            try {
                const response = await fetch(`${API_BASE}/students`);
                const students = await response.json();

                if (students.length === 0) {
                    tableDiv.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📭</div>
                            <h3>No students found</h3>
                            <p>Add your first student to get started!</p>
                        </div>
                    `;
                    return;
                }

                let tableHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Roll No</th>
                                <th>Email</th>
                                <th>Maths</th>
                                <th>Physics</th>
                                <th>Chemistry</th>
                                <th>English</th>
                                <th>Computer</th>
                                <th>Total</th>
                                <th>%</th>
                                <th>Grade</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                students.forEach(student => {
                    const gradeClass = `grade-${student.grade.toLowerCase().replace('+', '-plus')}`;
                    const statusClass = student.status === 'PASS' ? 'status-pass' : 'status-fail';

                    tableHTML += `
                        <tr>
                            <td>${student.id}</td>
                            <td>${student.name}</td>
                            <td>${student.rollNumber}</td>
                            <td>${student.email}</td>
                            <td>${student.mathsMarks}</td>
                            <td>${student.physicsMarks}</td>
                            <td>${student.chemistryMarks}</td>
                            <td>${student.englishMarks}</td>
                            <td>${student.computerMarks}</td>
                            <td>${student.totalMarks}</td>
                            <td>${student.percentage.toFixed(2)}%</td>
                            <td><span class="grade-badge ${gradeClass}">${student.grade}</span></td>
                            <td><span class="${statusClass}">${student.status}</span></td>
                            <td>
                                <button class="btn btn-danger" onclick="deleteStudent(${student.id})" style="padding: 5px 15px; font-size: 12px;">Delete</button>
                            </td>
                        </tr>
                    `;
                });

                tableHTML += '</tbody></table>';
                tableDiv.innerHTML = tableHTML;

            } catch (error) {
                tableDiv.innerHTML = '<div class="loading" style="color: #dc3545;">Error loading students. Make sure the server is running.</div>';
                console.error('Error:', error);
            }
        }

        async function addStudent(event) {
            event.preventDefault();

            const student = {
                name: document.getElementById('name').value,
                rollNumber: document.getElementById('rollNumber').value,
                email: document.getElementById('email').value,
                mathsMarks: parseInt(document.getElementById('mathsMarks').value),
                physicsMarks: parseInt(document.getElementById('physicsMarks').value),
                chemistryMarks: parseInt(document.getElementById('chemistryMarks').value),
                englishMarks: parseInt(document.getElementById('englishMarks').value),
                computerMarks: parseInt(document.getElementById('computerMarks').value)
            };

            try {
                const response = await fetch(`${API_BASE}/students`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(student)
                });

                const result = await response.json();

                if (response.ok) {
                    showMessage('Student added successfully!', 'success');
                    document.getElementById('studentForm').reset();
                    toggleForm();
                    loadStudents();
                } else {
                    showMessage('Error: ' + result.message, 'error');
                }
            } catch (error) {
                showMessage('Error adding student: ' + error.message, 'error');
                console.error('Error:', error);
            }
        }

        async function deleteStudent(id) {
            if (!confirm('Are you sure you want to delete this student?')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/students/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    showMessage('Student deleted successfully!', 'success');
                    loadStudents();
                } else {
                    showMessage('Error deleting student', 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
                console.error('Error:', error);
            }
        }

        async function bulkCalculate() {
            try {
                showMessage('Processing bulk calculation...', 'success');
                const response = await fetch(`${API_BASE}/students/bulk-calculate`, {
                    method: 'POST'
                });

                const result = await response.json();

                if (response.ok) {
                    showMessage(`Bulk calculation completed! Processed ${result.totalStudents} students.`, 'success');
                    loadStudents();
                } else {
                    showMessage('Error in bulk calculation', 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
                console.error('Error:', error);
            }
        }

        async function importCSV() {
            const fileInput = document.getElementById('csvFile');
            const file = fileInput.files[0];

            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            try {
                showMessage('Importing CSV file...', 'success');
                const response = await fetch(`${API_BASE}/files/import`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    showMessage(`Import successful! ${result.totalSaved} students saved.`, 'success');
                    loadStudents();
                } else {
                    showMessage('Error importing CSV: ' + result.message, 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
                console.error('Error:', error);
            }

            fileInput.value = '';
        }

        async function exportCSV() {
            try {
                window.location.href = `${API_BASE}/files/export`;
                showMessage('Exporting students to CSV...', 'success');
            } catch (error) {
                showMessage('Error exporting CSV: ' + error.message, 'error');
                console.error('Error:', error);
            }
        }
    </script>
</body>
</html>
